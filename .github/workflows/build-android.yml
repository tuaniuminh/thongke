name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Inject Supabase Secrets
        run: |
          URL_VAL="${{ secrets.VITE_SUPABASE_URL }}"
          if [ -z "$URL_VAL" ]; then
            URL_VAL="${{ vars.VITE_SUPABASE_URL }}"
          fi

          KEY_VAL="${{ secrets.VITE_SUPABASE_ANON_KEY }}"
          if [ -z "$KEY_VAL" ]; then
            KEY_VAL="${{ vars.VITE_SUPABASE_ANON_KEY }}"
          fi

          # Replace VITE_SUPABASE_URL_PLACEHOLDER and VITE_SUPABASE_ANON_KEY_PLACEHOLDER in src/core/app.js
          sed -i "s|VITE_SUPABASE_URL_PLACEHOLDER|$URL_VAL|g" src/core/app.js
          sed -i "s|VITE_SUPABASE_ANON_KEY_PLACEHOLDER|$KEY_VAL|g" src/core/app.js

      - name: Setup Java JDK
        uses: actions/setup-java@main
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Prepare Web Assets
        run: npm run prepare-dist

      - name: Add and Sync Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Inject Native Android Plugins
        run: |
          mkdir -p android/app/src/main/java/com/familife/thongke/
          cp src/native/android/AppUpdatePlugin.java android/app/src/main/java/com/familife/thongke/

      - name: Prepare Assets for Icon Generation
        run: |
          mkdir -p assets
          cp icon-512.png assets/icon.png
          cp icon-512.png assets/icon-only.png
          cp icon-512.png assets/splash.png
          cp icon-512.png assets/splash-only.png

      - name: Generate App Icons
        run: npm run generate-assets-android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Package and Rename APK
        id: get_version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          cp android/app/build/outputs/apk/debug/app-debug.apk "FamiLife_v${VERSION}.apk"
          echo "APK_NAME=FamiLife_v${VERSION}.apk" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@main
        with:
          name: FamiLife_android_v${{ steps.get_version.outputs.VERSION }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.get_version.outputs.VERSION }}"
          name: "FamiLife v${{ steps.get_version.outputs.VERSION }}"
          body: "Bản phát hành tự động FamiLife v${{ steps.get_version.outputs.VERSION }}"
          files: ${{ env.APK_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
